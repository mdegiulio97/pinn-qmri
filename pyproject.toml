[project]
name = "pinn-qmri"
version = "0.1.0"
description = "Physics-informed neural network for quantitative MRI parameter estimation (T2/T2* relaxometry) on synthetic and real data, with a per-pixel least-squares baseline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "torch>=2.2",
    "streamlit>=1.36",
    "nibabel>=5.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinn_qmri"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebooks use a cell-oriented style (imports after the sys.path setup, compact
# ';' statements for figures): excluded from lint to keep them as they are.
extend-exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
